name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: for file in tcptune.sh tools/*.sh tests/*.sh; do bash -n "$file"; done
      - run: bash tests/regression.sh
      - run: bash tests/integration.sh
      - run: bash tests/linux-process.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
